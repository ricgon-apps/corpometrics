<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Corpometrics"/>
<meta name="theme-color" content="#090d12"/>
<title>Corpometrics</title>
<link rel="apple-touch-icon" href="icon.png"/>
<link rel="icon" type="image/png" href="icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#090d12;--surf:#111720;--surf2:#172030;--border:#1c2b3a;--accent:#34e8a8;--gold:#f5c842;--red:#f56c6c;--blue:#3b9ef7;--muted:#4e6678;--text:#ddeeff;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;min-height:-webkit-fill-available;padding-bottom:calc(70px + var(--safe-bot));overflow-x:hidden}
.nav{position:sticky;top:0;z-index:100;background:var(--surf);border-bottom:1px solid var(--border);padding:calc(14px + var(--safe-top)) 20px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'DM Serif Display',serif;font-size:20px;color:var(--accent)}
.logo em{color:var(--muted);font-style:italic}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surf);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bot)}
.tab{flex:1;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)}
.tab.active{color:var(--accent)}
.tab-icon{font-size:20px;line-height:1}
.content{max-width:680px;margin:0 auto;padding:20px 16px}
.view{display:none}
.card{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.sec-label{font-size:10px;letter-spacing:0.13em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;display:block}
.btn-primary{display:block;width:100%;padding:15px;background:var(--accent);color:var(--bg);border-radius:10px;border:none;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;font-family:'DM Mono',monospace;font-weight:700}
.btn-ghost{display:block;width:100%;padding:13px;margin-top:10px;background:transparent;color:var(--muted);border-radius:10px;border:1px solid var(--border);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;font-family:'DM Mono',monospace}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.field label{display:block;font-size:10px;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.field input{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:9px;padding:13px 14px;color:var(--text);font-size:16px;font-family:'DM Mono',monospace;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus{border-color:var(--accent)}
.field.full{grid-column:1/-1}
.weight-hero{font-family:'DM Serif Display',serif;font-size:64px;line-height:1;letter-spacing:-2px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.weight-unit{font-size:24px;color:var(--muted)}
.delta-badge{font-size:11px;padding:3px 8px;border-radius:6px}
.delta-good{background:rgba(52,232,168,.15);color:var(--accent)}
.delta-bad{background:rgba(245,108,108,.15);color:var(--red)}
.delta-flat{background:rgba(78,102,120,.15);color:var(--muted)}
.derived-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.derived-item{background:var(--surf2);border-radius:8px;padding:9px 10px;border-top:2px solid}
.derived-val{font-family:'DM Serif Display',serif;font-size:18px}
.derived-unit{font-size:10px;color:var(--muted)}
.derived-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px}
.comp-row{margin-bottom:12px}
.comp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.comp-dot-label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.comp-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.comp-pct{font-family:'DM Serif Display',serif;font-size:17px}
.bar-wrap{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px}
.comp-ref{font-size:9px;color:var(--muted);margin-top:2px}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.metric-card{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:16px;border-top:3px solid}
.metric-icon{font-size:18px;margin-bottom:8px}
.metric-title{font-size:9px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.metric-val{font-family:'DM Serif Display',serif;font-size:30px;line-height:1}
.metric-unit{font-size:12px;color:var(--muted)}
.metric-kg{font-size:11px;color:var(--muted);margin-top:3px}
.metric-ref{font-size:10px;color:var(--muted);margin-top:3px}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;margin-top:6px}
.spark-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.spark-item{cursor:pointer;border-radius:10px;padding:8px;transition:background 0.15s}
.spark-item:active{background:var(--surf2)}
.spark-label{font-size:10px;color:var(--muted);letter-spacing:0.09em;text-transform:uppercase;margin-bottom:8px}
.spark-chart{height:44px;overflow:hidden}
.spark-vals{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}
.spark-dates{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:2px}
.hist-table{width:100%;border-collapse:collapse;font-size:12px}
.hist-table th{font-size:9px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;padding:0 8px 10px 0;text-align:left;border-bottom:1px solid var(--border)}
.hist-table td{padding:10px 8px 10px 0;border-bottom:1px solid var(--border);vertical-align:middle}
.hist-table tr:last-child td{border-bottom:none}
.date-cell{font-family:'DM Serif Display',serif;color:var(--gold);font-size:13px}
.act-btn{padding:4px 9px;border-radius:6px;font-size:10px;cursor:pointer;font-family:'DM Mono',monospace;background:transparent}
.evo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.evo-item{text-align:center}
.evo-lbl{font-size:9px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:5px}
.evo-val{font-family:'DM Serif Display',serif;font-size:22px;line-height:1}
.evo-from{font-size:10px;color:var(--muted);margin-top:4px}
.imc-box{display:flex;justify-content:space-between;align-items:center;background:var(--surf2);border-radius:10px;padding:10px 14px;border-left:3px solid var(--gold);margin:10px 0 14px}
.imc-val{font-family:'DM Serif Display',serif;font-size:26px;color:var(--gold)}
.imc-info{text-align:right;font-size:11px;color:var(--muted);line-height:1.6}
.imc-info strong{color:var(--gold);display:block;font-size:13px}
.toast{position:fixed;bottom:calc(80px + var(--safe-bot));left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);padding:10px 22px;border-radius:30px;font-size:12px;font-weight:700;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(52,232,168,.35);pointer-events:none;opacity:0;transition:opacity 0.2s}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px 20px}
.empty-icon{font-size:36px;margin-bottom:12px}
.empty-text{color:var(--muted);font-size:13px;margin-bottom:20px}
.cal-upload{border:2px dashed var(--border);border-radius:12px;padding:32px 20px;text-align:center;cursor:pointer;transition:border-color 0.2s;margin-bottom:16px}
.cal-upload:active{border-color:var(--accent)}
.chart-modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.chart-modal{background:var(--surf);border:1px solid var(--border);border-radius:18px;padding:24px 20px 20px;width:100%;max-width:560px;animation:slideUp 0.2s ease}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.cmt{font-size:11px;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.cmc{width:28px;height:28px;border-radius:50%;background:var(--surf2);border:1px solid var(--border);color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.cms-item{background:var(--surf2);border-radius:8px;padding:10px 12px;text-align:center}
.cms-item .sv{font-family:'DM Serif Display',serif;font-size:20px;line-height:1}
.cms-item .sl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:3px}
@media(min-width:600px){.spark-grid{grid-template-columns:repeat(4,1fr)}.metric-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="nav">
  <div class="logo">corpo<em>metrics</em></div>
  <div style="font-size:11px;color:var(--muted)" id="sync-status"></div>
</div>
<div class="content">
  <div id="view-setup" class="view"></div>
  <div id="view-dash"  class="view"></div>
  <div id="view-add"   class="view"></div>
  <div id="view-hist"  class="view"></div>
  <div id="view-cal"   class="view"></div>
</div>
<div class="tabs">
  <button class="tab" data-view="dash" onclick="switchView('dash')"><span class="tab-icon">&#128202;</span>Dashboard</button>
  <button class="tab" data-view="add"  onclick="switchView('add')"><span class="tab-icon">&#10133;</span>Medi&#231;&#227;o</button>
  <button class="tab" data-view="hist" onclick="switchView('hist')"><span class="tab-icon">&#128203;</span>Hist&#243;rico</button>
  <button class="tab" data-view="cal"  onclick="switchView('cal')"><span class="tab-icon">&#127869;</span>Calorias</button>
</div>
<div class="toast" id="toast"></div>
<script>
const LS_URL="cm_script_url",LS_DATA="cm_entries_cache";
const DEFAULT_URL="https://script.google.com/macros/s/AKfycbxsh5SNEyTAnmwwcF1Vq2vfZLzS5MWT6T9bcAukmL25XB0WZUhH8CgyB9pKctNIyfFO/exec";
let SCRIPT_URL=localStorage.getItem(LS_URL)||DEFAULT_URL;
let entries=[],editDate=null,currentView="dash";

const bmi=kg=>(kg/(1.82*1.82)).toFixed(1);
const kgFrom=(p,w)=>((p/100)*w).toFixed(1);
const fmt=(n,d)=>Number(n).toFixed(d||1);
const parseNum=v=>parseFloat(String(v).replace(",","."));

function toYMD(val){
  if(!val)return"";
  const s=String(val).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  if(/^\d{4}-\d{2}-\d{2}[T ]/.test(s))return s.substring(0,10);
  try{const d=new Date(s);if(!isNaN(d))return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");}catch(e){}
  return s.substring(0,10);
}

const MO=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
function fmtDate(v){if(!v)return"\u2014";const s=toYMD(v);if(!s||s.length<10)return String(v);const[y,m,d]=s.split("-");return d+"/"+MO[parseInt(m,10)-1]+"/"+y;}

function dlt(a,b){if(b==null)return null;const d=a-b;return{val:fmt(Math.abs(d)),dir:d<0?"down":d>0?"up":"flat"};}
function dltH(d,inv){
  if(!d)return"";
  const good=inv?d.dir==="down":d.dir==="up";
  const cls=d.dir==="flat"?"delta-flat":good?"delta-good":"delta-bad";
  const arr=d.dir==="up"?"▲":d.dir==="down"?"▼":"—";
  return'<span class="delta-badge '+cls+'">'+arr+" "+d.val+"</span>";
}

function showToast(msg,dur){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),dur||2400);}
function sorted(){return[...entries].sort((a,b)=>toYMD(a.date).localeCompare(toYMD(b.date)));}
function cacheE(l){try{localStorage.setItem(LS_DATA,JSON.stringify(l))}catch(e){}}
function loadCache(){try{const r=localStorage.getItem(LS_DATA);if(r)return JSON.parse(r);}catch(e){}return[];}

async function apiCall(params){
  if(!SCRIPT_URL)return null;
  try{const r=await fetch(SCRIPT_URL+"?"+new URLSearchParams(params).toString(),{redirect:"follow"});return await r.json();}catch(e){return null;}
}

async function syncFromSheets(){
  document.getElementById("sync-status").textContent="\u21BB a sincronizar...";
  const res=await apiCall({action:"getAll"});
  if(res&&res.ok){
    entries=res.entries.map(e=>({...e,date:toYMD(e.date)}));
    cacheE(entries);
    document.getElementById("sync-status").textContent="\u2713 sincronizado";
    setTimeout(()=>document.getElementById("sync-status").textContent="",2000);
    return true;
  }
  document.getElementById("sync-status").textContent="\u26A0 offline";
  return false;
}

function saveEntry(entry){
  const ex=entries.findIndex(e=>e.date===entry.date);
  if(ex>=0)entries[ex]=entry;else entries.push(entry);
  cacheE(entries);
  apiCall({action:"save",...entry}).then(res=>showToast(res&&res.ok?"\u2713 Sincronizado":"\u26A0 Guardado localmente"));
}

function deleteEntry(date){
  entries=entries.filter(e=>e.date!==date);
  cacheE(entries);
  showToast("Medi\u00E7\u00E3o apagada");
  apiCall({action:"delete",date});
}

function switchView(v){
  document.querySelectorAll(".view").forEach(el=>el.style.display="none");
  document.querySelectorAll(".tab").forEach(el=>el.classList.toggle("active",el.dataset.view===v));
  currentView=v;
  document.getElementById("view-"+v).style.display="block";
  renderView(v);
  window.scrollTo({top:0});
}

function renderView(v){
  if(v==="setup")renderSetup();
  if(v==="dash")renderDash();
  if(v==="add")renderAdd();
  if(v==="hist")renderHist();
  if(v==="cal")renderCal();
}

function renderSetup(){
  document.getElementById("view-setup").innerHTML='<div class="card" style="text-align:center;padding:32px 24px">'
    +'<h2 style="font-family:\'DM Serif Display\',serif;font-size:24px;color:var(--accent);margin-bottom:8px">⚙ Configuração</h2>'
    +'<p style="font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:20px">Cole aqui o URL do seu Google Apps Script.</p>'
    +'<input style="width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:9px;padding:13px 14px;color:var(--text);font-size:14px;font-family:\'DM Mono\',monospace;outline:none;margin-bottom:12px" id="url-input" type="url" placeholder="https://script.google.com/macros/s/..." value="'+SCRIPT_URL+'"/>'
    +'<button class="btn-primary" onclick="saveUrl()">Guardar e Testar</button>'
    +'<button class="btn-ghost" onclick="switchView(\'dash\')">Cancelar</button>'
    +'<div style="margin-top:16px;font-size:10px;color:var(--muted);line-height:1.8">Os dados ficam guardados no seu próprio Google Sheets.</div>'
    +'</div>';
}

async function saveUrl(){
  const url=document.getElementById("url-input").value.trim();
  if(!url.startsWith("https://script.google.com")){showToast("\u26A0 URL inv\u00E1lido");return;}
  SCRIPT_URL=url;localStorage.setItem(LS_URL,url);
  showToast("\u21BB A testar...",3000);
  const ok=await syncFromSheets();
  if(ok){showToast("\u2713 Liga\u00E7\u00E3o bem sucedida!");setTimeout(()=>switchView("dash"),800);}
  else showToast("\u26A0 N\u00E3o foi poss\u00EDvel ligar.");
}

function sparkSVG(data,color,w,h){
  w=w||160;h=h||44;
  if(data.length<2)return"";
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||0.1;
  const px=6,pt=8,pb=6;
  const pts=data.map((v,i)=>[px+(i/(data.length-1))*(w-px*2),pt+(1-(v-mn)/rng)*(h-pt-pb)]);
  const line=pts.map(p=>p.join(",")).join(" ");
  const area=pts[0].join(",")+" "+pts.slice(1).map(p=>p.join(",")).join(" ")+" "+pts[pts.length-1][0]+","+h+" "+px+","+h;
  const gid="g"+color.replace(/[^a-f0-9]/gi,"");
  return'<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="overflow:hidden;display:block;width:100%">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="'+color+'" stop-opacity="0.3"/>'
    +'<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'
    +'</linearGradient></defs>'
    +'<polygon points="'+area+'" fill="url(#'+gid+')"/>'
    +'<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+pts[pts.length-1][0]+'" cy="'+pts[pts.length-1][1]+'" r="4" fill="'+color+'"/>'
    +'</svg>';
}

function openChartModal(el){
  const raw=JSON.parse(decodeURIComponent(el.dataset.chart));
  const label=raw.label,data=raw.data,c=raw.c,dates=raw.dates;
  const mn=Math.min(...data),mx=Math.max(...data),avg=data.reduce((a,b)=>a+b,0)/data.length;
  const diff=data[data.length-1]-data[0];
  const trend=diff<0?"▼":diff>0?"▲":"—";
  const isGoodDown=label.includes("Gordura")||label.includes("Peso");
  const tc=diff===0?"var(--muted)":(isGoodDown?(diff<0?"var(--accent)":"var(--red)"):(diff>0?"var(--accent)":"var(--red)"));
  const W=320,H=120,px=10,pt=14,pb=14,rng=mx-mn||0.1;
  const pts=data.map((v,i)=>[px+(i/(data.length-1))*(W-px*2),pt+(1-(v-mn)/rng)*(H-pt-pb)]);
  const line=pts.map(p=>p.join(",")).join(" ");
  const area=pts[0].join(",")+" "+pts.slice(1).map(p=>p.join(",")).join(" ")+" "+pts[pts.length-1][0]+","+H+" "+px+","+H;
  const gid="mg"+c.replace(/[^a-f0-9]/gi,"");
  let dots="";
  pts.forEach(function(p,i){
    const fl=i===pts.length-1?c:(i===0?c+"88":c+"44");
    dots+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===0||i===pts.length-1?5:3)+'" fill="'+fl+'"/>';
    if(i===0||i===pts.length-1||data[i]===mn||data[i]===mx){
      const anchor=p[0]<30?"start":p[0]>W-30?"end":"middle";
      const dy=p[1]<20?14:-8;
      dots+='<text x="'+p[0]+'" y="'+(p[1]+dy)+'" text-anchor="'+anchor+'" font-size="9" fill="'+c+'">'+Number(data[i]).toFixed(1)+'</text>';
    }
  });
  const svg='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="overflow:hidden;display:block;width:100%">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+c+'" stop-opacity="0.25"/><stop offset="100%" stop-color="'+c+'" stop-opacity="0"/></linearGradient></defs>'
    +'<polygon points="'+area+'" fill="url(#'+gid+')"/>'
    +'<polyline points="'+line+'" fill="none" stroke="'+c+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +dots+'</svg>';
  const modal=document.createElement("div");
  modal.className="chart-modal-overlay";modal.id="chart-modal";
  modal.onclick=function(e){if(e.target===modal)closeChartModal();};
  modal.innerHTML='<div class="chart-modal">'
    +'<div class="cmt"><span>'+label+" — "+data.length+" medições</span>"
    +'<button class="cmc" onclick="closeChartModal()">✕</button></div>'
    +svg
    +'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px"><span>'+fmtDate(dates[0])+'</span><span>'+fmtDate(dates[dates.length-1])+'</span></div>'
    +'<div class="cms">'
    +'<div class="cms-item"><div class="sv" style="color:'+c+'">'+Number(mn).toFixed(1)+'</div><div class="sl">Mínimo</div></div>'
    +'<div class="cms-item"><div class="sv" style="color:'+c+'">'+Number(mx).toFixed(1)+'</div><div class="sl">Máximo</div></div>'
    +'<div class="cms-item"><div class="sv" style="color:'+c+'">'+Number(avg).toFixed(1)+'</div><div class="sl">Média</div></div>'
    +'</div>'
    +'<div style="margin-top:12px;background:var(--surf2);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center">'
    +'<span style="font-size:11px;color:var(--muted)">Variação total</span>'
    +'<span style="font-family:\'DM Serif Display\',serif;font-size:20px;color:'+tc+'">'+trend+" "+Math.abs(diff).toFixed(1)+'</span>'
    +'</div></div>';
  document.body.appendChild(modal);
}

function closeChartModal(){const m=document.getElementById("chart-modal");if(m)m.remove();}

function renderDash(){
  const s=sorted();
  const el=document.getElementById("view-dash");
  if(!SCRIPT_URL){
    el.innerHTML='<div class="card" style="text-align:center;padding:32px 24px">'
      +'<div style="font-size:36px;margin-bottom:12px">🔗</div>'
      +'<h2 style="font-family:\'DM Serif Display\',serif;color:var(--accent);margin-bottom:8px">Bem-vindo!</h2>'
      +'<p style="color:var(--muted);font-size:12px;line-height:1.8;margin-bottom:20px">Configure o Google Sheets para guardar os dados.</p>'
      +'<button class="btn-primary" onclick="switchView(\'setup\');renderSetup()">⚙ Configurar agora</button></div>';
    return;
  }
  if(s.length===0){
    el.innerHTML='<div class="card"><div class="empty"><div class="empty-icon">📊</div>'
      +'<div class="empty-text">Sem dados. Adicione a primeira medição!</div>'
      +'<button class="btn-primary" style="width:auto;padding:12px 24px;display:inline-block" onclick="switchView(\'add\')">+ Adicionar</button></div></div>';
    return;
  }
  const lt=s[s.length-1],pv=s[s.length-2];
  const bv=bmi(lt.weight);
  const bc=bv<25?"var(--accent)":bv<30?"var(--gold)":"var(--red)";
  const bl=bv<18.5?"Baixo peso":bv<25?"Normal":bv<30?"Pré-obesidade":"Obesidade";
  const wD=dlt(lt.weight,pv?.weight),fD=dlt(lt.fat,pv?.fat),tD=dlt(lt.tbw,pv?.tbw),mD=dlt(lt.mus,pv?.mus);

  let h='<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:8px">'
    +'<div><div style="font-size:10px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;margin-bottom:3px">Última medição</div>'
    +'<div style="font-family:\'DM Serif Display\',serif;font-size:20px">'+fmtDate(lt.date)+'</div></div>'
    +'<div style="text-align:right;font-size:11px;color:var(--muted);line-height:1.7">Masculino · 50 anos · 1,82m<br>'
    +'<span style="color:var(--gold)">'+s.length+" "+(s.length!==1?"medições":"medição")+'</span></div></div>';

  h+='<div class="card"><span class="sec-label">Peso</span>'
    +'<div class="weight-hero">'+lt.weight+'<span class="weight-unit">kg</span>'+dltH(wD,true)+'</div>'
    +'<div class="imc-box"><div><div style="font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px">IMC</div>'
    +'<div class="imc-val">'+bv+'</div></div>'
    +'<div class="imc-info"><strong>'+bl+'</strong>Normal: 18,5–24,9<br>Ideal: ~75–82 kg</div></div>'
    +'<div class="derived-grid">';
  [{l:"Gordura",v:kgFrom(lt.fat,lt.weight),c:"var(--red)"},
   {l:"Água",v:kgFrom(lt.tbw,lt.weight),c:"var(--blue)"},
   {l:"Músculo",v:kgFrom(lt.mus,lt.weight),c:"var(--accent)"}
  ].forEach(function(x){
    h+='<div class="derived-item" style="border-color:'+x.c+'">'
      +'<div class="derived-val" style="color:'+x.c+'">'+x.v+'<span class="derived-unit"> kg</span></div>'
      +'<div class="derived-lbl">'+x.l+'</div></div>';
  });
  h+='</div></div>';

  h+='<div class="card"><span class="sec-label">Composição Corporal</span>';
  [{l:"Gordura",p:lt.fat,d:fD,c:"var(--red)",inv:true,ref:"11–21%",mx:40},
   {l:"Músculo",p:lt.mus,d:mD,c:"var(--accent)",inv:false,ref:"35–44%",mx:44},
   {l:"Água",p:lt.tbw,d:tD,c:"var(--blue)",inv:false,ref:"50–65%",mx:65}
  ].forEach(function(x){
    h+='<div class="comp-row"><div class="comp-top">'
      +'<div class="comp-dot-label"><div class="comp-dot" style="background:'+x.c+'"></div>'+x.l+'</div>'
      +'<div><span class="comp-pct" style="color:'+x.c+'">'+fmt(x.p)+'%</span>'+dltH(x.d,x.inv)+'</div></div>'
      +'<div class="bar-wrap"><div class="bar-fill" style="width:'+Math.min((x.p/x.mx)*100,100)+'%;background:'+x.c+'"></div></div>'
      +'<div class="comp-ref">Ideal: '+x.ref+'</div></div>';
  });
  h+='</div>';

  h+='<div class="metric-grid">';
  [{ic:"🔥",tt:"Gordura",v:lt.fat,d:fD,c:"var(--red)",ch:"#f56c6c",kv:kgFrom(lt.fat,lt.weight),ref:"11–21%",mx:40,inv:true,ok:lt.fat<=21},
   {ic:"💧",tt:"Água",v:lt.tbw,d:tD,c:"var(--blue)",ch:"#3b9ef7",kv:kgFrom(lt.tbw,lt.weight),ref:"50–65%",mx:65,inv:false,ok:lt.tbw>=50&&lt.tbw<=65},
   {ic:"💪",tt:"Músculo",v:lt.mus,d:mD,c:"var(--accent)",ch:"#34e8a8",kv:kgFrom(lt.mus,lt.weight),ref:"35–44%",mx:44,inv:false,ok:lt.mus>=35}
  ].forEach(function(x){
    const bg=x.ok?"rgba(52,232,168,.14)":"rgba(245,108,108,.14)";
    const tc=x.ok?x.ch:"var(--red)";
    const tl=x.ok?"Normal":x.inv?"Acima":"Abaixo";
    h+='<div class="metric-card" style="border-top-color:'+x.c+'">'
      +'<div class="metric-icon">'+x.ic+'</div>'
      +'<div class="metric-title">'+x.tt+'</div>'
      +'<div class="metric-val" style="color:'+x.c+'">'+fmt(x.v)+'<span class="metric-unit">%</span></div>'
      +'<div class="metric-kg">≈ <strong>'+x.kv+' kg</strong></div>'
      +'<div class="metric-ref">Ref: '+x.ref+'</div>'
      +'<div class="bar-wrap" style="margin-top:8px"><div class="bar-fill" style="width:'+Math.min((x.v/x.mx)*100,100)+'%;background:'+x.c+'"></div></div>'
      +'<span class="tag" style="background:'+bg+';color:'+tc+'">'+tl+'</span></div>';
  });
  h+='</div>';

  if(s.length>=2){
    h+='<div class="card"><span class="sec-label">📉 Tendência histórica</span><div class="spark-grid">';
    [{label:"Peso (kg)",data:s.map(e=>e.weight),c:"#f5c842"},
     {label:"Gordura %",data:s.map(e=>e.fat),c:"#f56c6c"},
     {label:"Água %",data:s.map(e=>e.tbw),c:"#3b9ef7"},
     {label:"Músculo %",data:s.map(e=>e.mus),c:"#34e8a8"}
    ].forEach(function(x){
      const dk=encodeURIComponent(JSON.stringify({label:x.label,data:x.data,c:x.c,dates:s.map(e=>e.date)}));
      h+='<div class="spark-item" onclick="openChartModal(this)" data-chart="'+dk+'">'
        +'<div class="spark-label">'+x.label+'</div>'
        +'<div class="spark-chart">'+sparkSVG(x.data,x.c,160,44)+'</div>'
        +'<div class="spark-vals"><span>'+fmt(x.data[0])+'</span><strong style="color:var(--text)">'+fmt(x.data[x.data.length-1])+'</strong></div>'
        +'<div class="spark-dates"><span>'+fmtDate(s[0].date)+'</span><span>'+fmtDate(s[s.length-1].date)+'</span></div></div>';
    });
    h+='</div></div>';

    const fi=s[0],la=s[s.length-1];
    const days=Math.round((new Date(la.date)-new Date(fi.date))/86400000);
    h+='<div class="card"><span class="sec-label">📊 Evolução total ('+days+' dias)</span><div class="evo-grid">';
    [{l:"Peso",fr:fi.weight,to:la.weight,u:"kg",inv:true},
     {l:"Gordura",fr:fi.fat,to:la.fat,u:"%",inv:true},
     {l:"Água",fr:fi.tbw,to:la.tbw,u:"%",inv:false},
     {l:"Músculo",fr:fi.mus,to:la.mus,u:"%",inv:false}
    ].forEach(function(x){
      const df=x.to-x.fr;
      const good=x.inv?df<0:df>0;
      const col=df===0?"var(--muted)":good?"var(--accent)":"var(--red)";
      const arr=df>0?"▲":df<0?"▼":"—";
      h+='<div class="evo-item"><div class="evo-lbl">'+x.l+'</div>'
        +'<div class="evo-val" style="color:'+col+'">'+arr+" "+fmt(Math.abs(df))+'<span style="font-size:11px;color:var(--muted)">'+x.u+'</span></div>'
        +'<div class="evo-from">'+fmt(x.fr)+x.u+" → "+fmt(x.to)+x.u+'</div></div>';
    });
    h+='</div></div>';
  }
  el.innerHTML=h;
}

function submitForm(){
  const w=parseNum(document.getElementById("f-weight").value);
  const f=parseNum(document.getElementById("f-fat").value);
  const t=parseNum(document.getElementById("f-tbw").value);
  const m=parseNum(document.getElementById("f-mus").value);
  const date=document.getElementById("f-date").value;
  if(!date||isNaN(w)||isNaN(f)||isNaN(t)||isNaN(m)){showToast("⚠ Preencha todos os campos");return;}
  saveEntry({date,weight:w,fat:f,tbw:t,mus:m});
  showToast("✓ Medição guardada!");
  editDate=null;switchView("dash");
}

let calB64=null;

function handleCalImage(event){
  const file=event.target.files[0];if(!file)return;
  const img=new Image(),reader=new FileReader();
  reader.onload=function(e){
    img.onload=function(){
      const MAX=1200;let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      let q=0.82,du=cv.toDataURL("image/jpeg",q);
      while(du.length>4*1024*1024&&q>0.3){q-=0.1;du=cv.toDataURL("image/jpeg",q);}
      calB64=du.split(",")[1];
      document.getElementById("cal-img").src=du;
      document.getElementById("cal-preview").style.display="block";
      document.getElementById("cal-upload-area").style.display="none";
      document.getElementById("cal-result").style.display="none";
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function resetCal(){
  calB64=null;
  document.getElementById("cal-preview").style.display="none";
  document.getElementById("cal-upload-area").style.display="block";
  document.getElementById("cal-result").style.display="none";
  document.getElementById("cal-input").value="";
}

function buildResult(info){
  const cls=(info.classificacao||"").toLowerCase().replace(/saud.vel/,"saudavel").replace(/cal.rico/,"calorico").trim();
  const cc=cls==="saudavel"?"var(--accent)":cls==="moderado"?"var(--gold)":"var(--red)";
  const cl=cls==="saudavel"?"✓ Saudável":cls==="moderado"?"⚠ Moderado":"🔴 Calórico";
  info.calorias=Number(info.calorias)||0;
  info.proteinas=Number(info.proteinas)||0;
  info.carboidratos=Number(info.carboidratos)||0;
  info.gorduras=Number(info.gorduras)||0;
  info.fibra=Number(info.fibra)||0;
  info.nome=info.nome||"Alimentos identificados";
  info.porcao=info.porcao||"N/D";
  info.nota=info.nota||"";
  info.alternativas=Array.isArray(info.alternativas)?info.alternativas:[];

  let mh="";
  [{l:"Proteínas",v:info.proteinas,c:"var(--accent)"},
   {l:"Carboidratos",v:info.carboidratos,c:"var(--blue)"},
   {l:"Gorduras",v:info.gorduras,c:"var(--red)"},
   {l:"Fibra",v:info.fibra,c:"var(--gold)"}
  ].forEach(function(m){
    mh+='<div style="background:var(--surf2);border-radius:8px;padding:10px 8px;text-align:center;border-top:2px solid '+m.c+'">'
      +'<div style="font-family:\'DM Serif Display\',serif;font-size:20px;color:'+m.c+'">'+m.v+'</div>'
      +'<div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px">'+m.l+'</div></div>';
  });

  let ah="";
  info.alternativas.forEach(function(a){
    ah+='<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--text)">'
      +'<span style="color:var(--accent);font-size:14px">→</span>'+a+'</div>';
  });

  return'<div style="border-top:1px solid var(--border);padding-top:18px;margin-top:4px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">'
    +'<div><div style="font-family:\'DM Serif Display\',serif;font-size:20px;color:var(--text)">'+info.nome+'</div>'
    +'<div style="font-size:11px;color:var(--muted);margin-top:2px">Porção estimada: '+info.porcao+'</div></div>'
    +'<span style="padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;background:'+cc+'22;color:'+cc+'">'+cl+'</span></div>'
    +'<div style="background:var(--surf2);border-radius:12px;padding:16px 20px;text-align:center;margin-bottom:14px;border-left:4px solid var(--gold)">'
    +'<div style="font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Calorias totais</div>'
    +'<div style="font-family:\'DM Serif Display\',serif;font-size:52px;color:var(--gold);line-height:1">'+info.calorias+'</div>'
    +'<div style="font-size:12px;color:var(--muted)">kcal</div></div>'
    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">'+mh+'</div>'
    +'<div style="margin-bottom:14px">'
    +'<div style="font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px">💡 Alternativas mais saudáveis</div>'
    +ah+'</div>'
    +(info.nota?'<div style="background:var(--surf2);border-radius:8px;padding:12px 14px;font-size:11px;color:var(--muted);line-height:1.7;font-style:italic;margin-bottom:14px">"'+info.nota+'"</div>':"")
    +'<button onclick="resetCal()" class="btn-ghost" style="margin-top:6px">Analisar outra foto</button></div>';
}

async function analyzeFood(){
  if(!calB64)return;
  const btn=document.getElementById("cal-btn");
  btn.disabled=true;btn.textContent="↻ A analisar...";
  const rEl=document.getElementById("cal-result");rEl.style.display="none";
  try{
    if(!SCRIPT_URL)throw new Error("Apps Script não configurado.");
    const res=await fetch(SCRIPT_URL,{method:"POST",redirect:"follow",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:"action=analyzeFood&mediaType=image%2Fjpeg&imageBase64="+encodeURIComponent(calB64)});
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    if(!data.ok||!data.result)throw new Error("Resposta inesperada.");
    rEl.innerHTML=buildResult(data.result);rEl.style.display="block";
  }catch(err){
    rEl.innerHTML='<div style="color:var(--red);font-size:12px;padding:14px;background:rgba(245,108,108,.1);border-radius:8px;margin-top:8px">⚠ '+err.message+'</div>';
    rEl.style.display="block";
  }
  btn.disabled=false;btn.textContent="Analisar calorias";
}

async function init(){
  entries=loadCache();
  if(!SCRIPT_URL){
    document.querySelector(".tabs").style.display="none";
    document.getElementById("view-setup").style.display="block";
    renderSetup();return;
  }
  document.querySelector(".tabs").style.display="flex";
  switchView("dash");
  const ok=await syncFromSheets();
  if(ok)renderView(currentView);
}
init();
